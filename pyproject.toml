[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolshield"
version = "0.1.0"
description = "Implementation-aware security proxy for Model Context Protocol (MCP) servers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
toolshield = "toolshield.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/toolshield", "test_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-v --tb=short"
